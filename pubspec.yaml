name: gymbro_app
description: "RepBirds: allenati da solo o in gruppo. Client Flutter per gymbro-api."
publish_to: 'none'
version: 1.0.0+5TEST

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  intl: any
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/mock/

# Splash nativo (iOS + Android, incluso Android 12+). Dopo ogni modifica:
#   dart run flutter_native_splash:create
# Colore = centro dello SkyBackground dello splash in-app, così il passaggio è morbido.
flutter_native_splash:
  color: "#EAE7FB"
  image: assets/splash/logo.png
  android_12:
    color: "#EAE7FB"
    image: assets/splash/logo_android12.png
  fullscreen: false
  web: false
